services:
  db:
    image: postgres:19.0
    container_name: purgeai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: purgeai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d purgeai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
